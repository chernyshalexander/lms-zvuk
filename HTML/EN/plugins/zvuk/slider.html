<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Axis Slider (XY Pad)</title>
    <style>
        :root {
            --pad-size: 300px;
            --thumb-size: 24px;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            font-family: sans-serif;
        }

        /* The 2D bounding track */
        .slider-pad {
            position: relative;
            width: var(--pad-size);
            height: var(--pad-size);
            background-color: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            cursor: crosshair;
            touch-action: none; /* Prevents mobile scrolling while dragging */
        }

        /* Center gridlines for visual guidance */
        .slider-pad::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            border-left: 1px dashed #cbd5e1;
        }
        .slider-pad::after {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 50%;
            border-top: 1px dashed #cbd5e1;
        }

        /* The draggable slider handle */
        .slider-thumb {
            position: absolute;
            width: var(--thumb-size);
            height: var(--thumb-size);
            background-color: #3b82f6;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
            /* Perfect cursor centering offset */
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
            pointer-events: none; /* Allows click-to-jump on the pad */
            transition: background-color 0.1s;
        }

        .slider-pad:active .slider-thumb {
            background-color: #1d4ed8;
        }

        /* Output text styling */
        .stats-display {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #374151;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="slider-pad" id="sliderPad">
        <div class="slider-thumb" id="sliderThumb"></div>
    </div>

    <div class="stats-display">
        X: <span id="xValue">50</span>% | Y: <span id="yValue">50</span>%
    </div>

    <script>
        const pad = document.getElementById('sliderPad');
        const thumb = document.getElementById('sliderThumb');
        const xText = document.getElementById('xValue');
        const yText = document.getElementById('yValue');

        let isDragging = false;

        function updateSlider(e) {
            const rect = pad.getBoundingClientRect();
            
            // Extract interaction coordinates depending on Mouse or Touch events
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            // Calculate offset relative to pad bounding box
            let x = clientX - rect.left;
            let y = clientY - rect.top;

            // Constrain coordinates strictly within boundaries (0 to pad width/height)
            x = Math.max(0, Math.min(x, rect.width));
            y = Math.max(0, Math.min(y, rect.height));

            // Convert to percentages (0% - 100%)
            const xPct = Math.round((x / rect.width) * 100);
            
            // Invert Y calculation so up=100 and down=0 (standard Cartesian grid)
            const yPct = Math.round((1 - (y / rect.height)) * 100);

            // Move the visible DOM handle
            thumb.style.left = `${(x / rect.width) * 100}%`;
            thumb.style.top = `${(y / rect.height) * 100}%`;

            // Display numerical values
            xText.textContent = xPct;
            yText.textContent = yPct;
        }

        // Mouse Events
        pad.addEventListener('mousedown', (e) => {
            isDragging = true;
            updateSlider(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) updateSlider(e);
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch Events (Mobile Support)
        pad.addEventListener('touchstart', (e) => {
            isDragging = true;
            updateSlider(e);
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) updateSlider(e);
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
