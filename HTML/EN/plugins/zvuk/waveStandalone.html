<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>[% "PLUGIN_ZVUK_WAVE_SLIDERS" | string %]</title>
<style>
/* ================================================================
   MODAL STYLES (from basic.html)
   ================================================================ */
.wave-modal-overlay {
	display: none;
	position: fixed;
	top: 0; left: 0;
	width: 100%; height: 100%;
	background: rgba(0,0,0,0.5);
	z-index: 1000;
}

.wave-modal-box {
	position: absolute;
	top: 50%; left: 50%;
	transform: translate(-50%,-50%);
	background: white;
	border-radius: 8px;
	max-width: min(96vw, 1000px);
	width: 96%;
	max-height: 90vh;
	overflow-y: auto;
	box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.wave-modal-header {
	padding: 20px;
	border-bottom: 1px solid #ddd;
	display: flex;
	justify-content: space-between;
	align-items: center;
}

.wave-modal-header h2 {
	margin: 0;
	color: #222;
	font-weight: bold;
	font-size: 18px;
}

.wave-modal-close {
	background: none;
	border: none;
	font-size: 24px;
	cursor: pointer;
	color: #999;
}

.wave-modal-content { padding: 20px; }

/* Dark theme */
html.zvuk-dark-theme .wave-modal-overlay { background: rgba(0,0,0,0.65); }
html.zvuk-dark-theme .wave-modal-box { background: #2d2d2d; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
html.zvuk-dark-theme .wave-modal-header { border-bottom-color: #444; }
html.zvuk-dark-theme .wave-modal-header h2 { color: #eee; }
html.zvuk-dark-theme .wave-modal-close { color: #aaa; }
html.zvuk-dark-theme .wave-modal-close:hover { color: #eee; }

/* Wide host window: use the extra width instead of one long column
   across classic-web embed, Material dialog, and standalone tab. */
@media (min-width: 900px) {
	.wave-settings-container {
		display: grid;
		grid-template-columns: repeat(6, minmax(0, 1fr));
		gap: 16px;
	}
	.wave-settings-container .wave-setting-group { margin-bottom: 0; }

	/* the pad and the genre list need the full width */
	.wave-setting-group.mood-group,
	.wave-setting-group.genres-group { grid-column: 1 / -1; }
	.button-group { grid-column: 1 / -1; }

	/* popularity, vocal and language each take a third of one row: the slider
	   simply gets a tighter step, and the two pill rows already leave room */
	.wave-setting-group.popularity-group,
	.wave-setting-group.vocal-group,
	.wave-setting-group.language-group {
		grid-column: span 2;
		/* equal heights across the row, content pinned to the edges */
		display: flex;
		flex-direction: column;
		justify-content: space-between;
	}

	/* keep eleven steps legible in the narrower track */
	.step-input-dot { width: 9px; height: 9px; }

	/* a third of the row is tight for pill labels: trim the side padding so
	   three language pills still share one line */
	.pill-btn { padding: 6px 10px; }

	/* instrumental mode hides the language card: the two remaining cards take
	   the free space instead of leaving a hole */
	body.zvuk-no-language .wave-setting-group.popularity-group,
	body.zvuk-no-language .wave-setting-group.vocal-group {
		grid-column: span 3;
	}
}

/* Embedded in the classic-web modal host: the host draws the backdrop and the
   close button, so this page only contributes the card itself. */
[% IF embed %]
html, body { background: transparent !important; margin: 0; }
.wave-modal-overlay {
	display: block !important;
	position: static;
	width: auto;
	height: auto;
	background: transparent;
}
.wave-modal-box {
	position: static;
	transform: none;
	width: auto;
	max-width: none;
	max-height: none;
	margin: 0;
	border-radius: 0;
	box-shadow: none;
	overflow: visible;
}
.wave-modal-header { padding: 14px 16px; }
.wave-modal-header .wave-modal-close { display: none; }
.wave-modal-content { padding: 16px; }
[% END %]
</style>
</head>
<body[% IF embed %] class="zvuk-embed"[% END %]>
<!-- Wave Sliders Modal -->
<div id="waveSliderModal" class="wave-modal-overlay">
	<div id="waveSliderBox" class="wave-modal-box">
		<div class="wave-modal-header">
			<h2>[% "PLUGIN_ZVUK_WAVE_SLIDERS" | string %]</h2>
			<button type="button" onclick="closeWaveSliderModal()" class="wave-modal-close">&times;</button>
		</div>
		<div id="waveSliderContent" class="wave-modal-content">
[% PROCESS plugins/zvuk/waveSliders.html %]
		</div>
	</div>
</div>

<script>
(function() {
	// ================================================================
	// DETECT MATERIAL THEME (same as settings page)
	// ================================================================
	function zvukDetectDarkTheme() {
		var chosen;
		try {
			chosen = window.localStorage.getItem('lms-material::theme');
		} catch (e) {}

		if (!chosen) {
			// Material default is dark
			return true;
		}
		if (chosen.indexOf('auto') === 0) {
			return !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
		}
		chosen = chosen.replace('darker', 'dark');
		return chosen.indexOf('light') !== 0 && chosen.indexOf('/light/') === -1;
	}

	function zvukApplyTheme() {
		document.documentElement.classList.toggle('zvuk-dark-theme', zvukDetectDarkTheme());
	}

	var IS_EMBED = [% IF embed %]true[% ELSE %]false[% END %];

	function getHostWindow() {
		try {
			if (window.top && window.top.document) {
				return window.top;
			}
		} catch (e) {}
		try {
			if (window.parent && window.parent.document) {
				return window.parent;
			}
		} catch (e) {}
		return window;
	}

	function getHostScreenWidth() {
		var hostWin = getHostWindow();
		var w = 0;
		try {
			w = hostWin.innerWidth || (hostWin.document && hostWin.document.documentElement && hostWin.document.documentElement.clientWidth) || 0;
		} catch (e) {}
		if (!w) {
			w = window.innerWidth || (document.documentElement && document.documentElement.clientWidth) || 0;
		}
		if (!w && window.screen) {
			w = window.screen.availWidth || window.screen.width || 0;
		}
		return w || 1000;
	}

	function calcModalWidth(screenWidth) {
		return Math.min(Math.floor(screenWidth * 0.96), 1000);
	}

	function findParentDialog() {
		if (!window.parent || window.parent === window) {
			return null;
		}
		try {
			var parentDoc = window.parent.document;
			if (window.frameElement) {
				var el = window.frameElement.parentNode;
				while (el && el !== parentDoc.body && el !== parentDoc.documentElement) {
					if (el.classList && (el.classList.contains('v-dialog') || el.getAttribute('role') === 'dialog')) {
						return el;
					}
					el = el.parentNode;
				}
			}
			var dialogs = parentDoc.querySelectorAll('.v-dialog--active, .v-dialog, [role="dialog"], .dialog, .modal');
			for (var i = 0; i < dialogs.length; i++) {
				var d = dialogs[i];
				if (d.classList && d.classList.contains('v-dialog__content')) {
					continue;
				}
				if (d.offsetWidth > 0 || d.offsetHeight > 0) {
					return d;
				}
			}
		} catch (e) {}
		return null;
	}

	function applyResponsiveWidth() {
		if (IS_EMBED) {
			return;
		}
		var targetWidth = calcModalWidth(getHostScreenWidth());
		var modalBox = document.getElementById('waveSliderBox');
		var inMaterialFrame = false;

		if (window.parent && window.parent !== window) {
			try {
				if (typeof window.parent.zvukCloseWaveModal !== 'function') {
					inMaterialFrame = true;
					var parentDialog = findParentDialog();
					if (parentDialog && !(parentDialog.classList && parentDialog.classList.contains('v-dialog--fullscreen'))) {
						parentDialog.style.width = targetWidth + 'px';
						parentDialog.style.maxWidth = '96vw';
					}
				}
			} catch (e) {}
		}

		if (modalBox) {
			modalBox.style.width = inMaterialFrame ? '100%' : '96%';
			modalBox.style.maxWidth = targetWidth + 'px';
		}
	}

	// ================================================================
	// INITIALIZATION (same as settings page)
	// ================================================================
	function initializeStandalone() {
		zvukApplyTheme();
		applyResponsiveWidth();

		var hostWin = getHostWindow();
		if (!IS_EMBED && hostWin && hostWin.addEventListener) {
			hostWin.addEventListener('resize', applyResponsiveWidth);
			var cleanupResize = function() {
				try { hostWin.removeEventListener('resize', applyResponsiveWidth); } catch (e) {}
			};
			window.addEventListener('pagehide', cleanupResize);
			window.addEventListener('unload', cleanupResize);
		}

		// Initialize modal event handlers
		var modal = document.getElementById('waveSliderModal');
		var modalBox = document.getElementById('waveSliderBox');

		if (modal && modalBox) {
			modal.addEventListener('click', function(e) {
				if (e.target === modal) {
					closeModal();
				}
			});

			modalBox.addEventListener('click', function(e) {
				e.stopPropagation();
			});
		}

		// Auto-open modal for standalone mode
		if (modal) {
			modal.style.display = 'block';
		}

		// (waveSliders.html is processed directly inside waveSliderContent)
	}

	function triggerClickSequence(btn) {
		if (!btn) return;
		console.log('[zvuk] Simulating click sequence on button:', btn);
		try {
			var downEvent = new MouseEvent('mousedown', {
				bubbles: true,
				cancelable: true,
				view: window.parent || window
			});
			btn.dispatchEvent(downEvent);

			var upEvent = new MouseEvent('mouseup', {
				bubbles: true,
				cancelable: true,
				view: window.parent || window
			});
			btn.dispatchEvent(upEvent);

			var clickEvent = new MouseEvent('click', {
				bubbles: true,
				cancelable: true,
				view: window.parent || window
			});
			btn.dispatchEvent(clickEvent);
		} catch (e) {
			console.error('[zvuk] Failed to dispatch MouseEvents, falling back to click()', e);
			if (typeof btn.click === 'function') {
				btn.click();
			}
		}
	}

	function closeParentDialog() {
		if (window.parent && window.parent !== window) {
			try {
				var parentDoc = window.parent.document;
				var dialogs = parentDoc.querySelectorAll('.v-dialog__content--active, .v-dialog--active, .v-dialog, [role="dialog"], .dialog, .modal');
				for (var d = 0; d < dialogs.length; d++) {
					var dialog = dialogs[d];
					if (dialog.offsetWidth === 0 && dialog.offsetHeight === 0) {
						continue;
					}
					var buttons = dialog.querySelectorAll('button, a, [role="button"]');
					for (var i = 0; i < buttons.length; i++) {
						var btn = buttons[i];
// Cyrillic and the multiplication sign are written as \u escapes on purpose:
						// the template loader does not decode this file as UTF-8, so a literal
						// would reach the browser as mojibake and never match the dialog text.
						var txt = (btn.textContent || btn.innerText || '').toLowerCase().trim();
						var title = (btn.getAttribute('title') || '').toLowerCase();
						var aria = (btn.getAttribute('aria-label') || '').toLowerCase();
						var cls = (btn.className || '').toLowerCase();
						if (txt.indexOf('close') !== -1 || txt.indexOf('clear') !== -1 || txt.indexOf('cancel') !== -1 || 
						    txt.indexOf('\u0437\u0430\u043a\u0440\u044b\u0442\u044c') !== -1 || txt.indexOf('\u043e\u0442\u043c\u0435\u043d\u0430') !== -1 || txt === 'x' || txt === '\u00d7' ||
						    title.indexOf('close') !== -1 || title.indexOf('clear') !== -1 || title.indexOf('cancel') !== -1 || title.indexOf('\u0437\u0430\u043a\u0440\u044b\u0442\u044c') !== -1 ||
						    aria.indexOf('close') !== -1 || aria.indexOf('clear') !== -1 || aria.indexOf('cancel') !== -1 || aria.indexOf('\u0437\u0430\u043a\u0440\u044b\u0442\u044c') !== -1 ||
						    cls.indexOf('close') !== -1 || cls.indexOf('clear') !== -1 || cls.indexOf('cancel') !== -1 ||
						    btn.querySelector('.v-icon') || btn.querySelector('i') || btn.querySelector('span')) {
							triggerClickSequence(btn);
							return true;
						}
					}
				}
				for (var d = 0; d < dialogs.length; d++) {
					var dialog = dialogs[d];
					if (dialog.offsetWidth > 0 || dialog.offsetHeight > 0) {
						var buttons = dialog.querySelectorAll('button');
						if (buttons.length > 0) {
							triggerClickSequence(buttons[0]);
							return true;
						}
					}
				}
			} catch (e) {
				console.error('[zvuk] Failed to close parent dialog:', e);
			}
		}
		return false;
	}

	// Override close function for standalone mode
	window.closeWaveSliderModal = function() {
		if (closeParentDialog()) {
			return;
		}
		// Standalone mode - hide modal and go back/close
		var modal = document.getElementById('waveSliderModal');
		if (modal) {
			modal.style.display = 'none';
		}
		try {
			if (window.history.length > 1) {
				window.history.back();
			} else {
				window.close();
			}
		} catch (e) {
			console.error('[zvuk] Failed to navigate back/close:', e);
		}
	};

	function closeModal() {
		if (closeParentDialog()) {
			return;
		}
		// For standalone mode - hide modal and go back/close
		var modal = document.getElementById('waveSliderModal');
		if (modal) {
			modal.style.display = 'none';
		}
		try {
			if (window.history.length > 1) {
				window.history.back();
			} else {
				window.close();
			}
		} catch (e) {
			console.error('[zvuk] Failed to navigate back/close:', e);
		}
	}

	// Listen for theme changes
	window.addEventListener('storage', function(e) {
		if (e.key === 'lms-material::theme') {
			zvukApplyTheme();
		}
	});

	// Start initialization
	if (document.readyState === 'interactive' || document.readyState === 'complete') {
		initializeStandalone();
	} else {
		document.addEventListener('DOMContentLoaded', initializeStandalone);
	}
})();
</script>
</body>
</html>
